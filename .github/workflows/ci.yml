name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      HAS_DEPENDENCY_TOKEN: ${{ secrets.DEPENDENCY_REPO_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Configure private dependency access
        if: ${{ env.HAS_DEPENDENCY_TOKEN == 'true' }}
        env:
          DEPENDENCY_REPO_TOKEN: ${{ secrets.DEPENDENCY_REPO_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${DEPENDENCY_REPO_TOKEN}@github.com/".insteadOf "https://github.com/"
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Ruff
        run: uv run ruff check .
      - name: Mypy
        run: uv run mypy
      - name: Tests
        run: uv run pytest
      - name: Build package
        run: uv run python -m build
